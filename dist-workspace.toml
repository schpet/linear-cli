# Native-only dist root: invoke cargo-dist0.31.0 from rust/, never repository root.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.31.0"
ci = []
installers = ["shell", "npm", "homebrew"]
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
hosting = ["github"]
publish-jobs = []
pr-run-mode = "skip"
npm-scope = "@schpet"
npm-package = "linear-cli"
tap = "schpet/homebrew-tap"
formula = "linear"
install-path = "CARGO_HOME"
install-updater = true
checksum = "sha256"
# Source comes from the explicit jj snapshot manifest, not git HEAD.
source-tarball = false
# No github-build-setup: the root generic Deno/codegen workflow stays separate.
# hosting computes installer URLs; never invoke host/upload/publish/tag here.
# Updater must be provisioned/qualified by the writer or reported LIMIT.
