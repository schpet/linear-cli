[package]
name = "mdast_util_to_markdown"
version = "0.0.2"
edition = "2018"
publish = false
license = "MIT"
description = "Vendored mdast serializer with source-compatible GFM extensions"

[dependencies]
markdown = { version = "=1.0.0", default-features = false }
regex = { version = "=1.13.1", default-features = false, features = ["std", "unicode", "perf"] }
