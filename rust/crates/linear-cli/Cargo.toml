[package]
name = "linear-cli"
version = "2.6.0"
edition = "2024"
publish = false

[dependencies]
unicode-width = "=0.2.2"
cynic = { version = "=3.14.0", default-features = false, features = ["rkyv"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "=1.47.4", default-features = false, features = ["rt", "time", "macros"] }

[dev-dependencies]
tokio = { version = "=1.47.4", default-features = false, features = ["process", "io-util"] }

[lib]
name = "linear_cli"
path = "src/lib.rs"

[[bin]]
name = "linear"
path = "src/main.rs"

[[example]]
name = "f02b_fixed_host_probe"
path = "examples/f02b_fixed_host_probe.rs"
test = true

[build-dependencies]
cynic-codegen = { version = "=3.14.0", features = ["rkyv"] }

[[test]]
name = "contracts"
path = "tests/contracts/main.rs"

[[test]]
name = "graphql"
path = "tests/graphql/main.rs"
