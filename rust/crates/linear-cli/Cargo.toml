[package]
name = "linear-cli"
version = "3.0.0-alpha.1"
edition = "2024"
publish = false

[dependencies]
linear-schema = { path = "../linear-schema" }
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "string", "error-context", "derive", "suggestions"] }
clap_complete = { version = "=4.6.11", default-features = false }
unicode-width = "=0.2.2"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
icu_collator = { version = "=2.3.1", default-features = false, features = ["compiled_data"] }
terminal_size = "=0.4.4"
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "windows", "use-dev-tty"] }
console = { version = "=0.16.6", default-features = false, features = ["std"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
gethostname = "=1.1.0"
cynic = { version = "=3.14.0", default-features = false, features = ["rkyv"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "raw_value"] }
ryu-js = "=1.0.3"
toml = { version = "=1.0.3", default-features = false, features = ["parse", "std", "serde", "preserve_order"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "=1.47.4", default-features = false, features = ["rt", "time", "macros", "net", "process", "io-util"] }

markdown = { version = "=1.0.0", default-features = false }
mdast_util_to_markdown = { version = "=0.0.2", path = "../../vendor/mdast_util_to_markdown" }
sha2 = { version = "=0.11.0", default-features = false }
hyper = { version = "=1.11.1", default-features = false }
data-url = { version = "=0.3.2", default-features = false, features = ["std"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
brotli-decompressor = { version = "=6.0.1", default-features = false, features = ["std"] }

futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
rustix = { version = "=1.1.5", default-features = false, features = ["std", "termios", "event", "fs"] }

[dev-dependencies]
tokio = { version = "=1.47.4", default-features = false, features = ["process", "io-util"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }

[lib]
name = "linear_cli"
path = "src/lib.rs"

[[bin]]
name = "linear"
path = "src/main.rs"

[[example]]
name = "f02b_fixed_host_probe"
path = "examples/f02b_fixed_host_probe.rs"
test = true

[build-dependencies]
cynic-codegen = { version = "=3.14.0", features = ["rkyv"] }

[[test]]
name = "contracts"
path = "tests/contracts/main.rs"

[[test]]
name = "commands"
path = "tests/commands/main.rs"

[[test]]
name = "graphql"
path = "tests/graphql/main.rs"

[[test]]
name = "config"
path = "tests/config/main.rs"

[[test]]
name = "auth"
path = "tests/auth/main.rs"

[[test]]
name = "startup"
path = "tests/startup/main.rs"

[[test]]
name = "refs"
path = "tests/refs/main.rs"
