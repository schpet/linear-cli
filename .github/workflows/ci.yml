name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's runs still in
# flight. Pushes to main each get their own group, so they always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            optional: false
          - os: macos-latest
            optional: false
          - os: windows-latest
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      # rust-toolchain.toml pins the version and components.
      - name: Install Rust
        run: rustup toolchain install
      # Caches the cargo registry and the compiled dependencies in target/,
      # keyed on the runner, the toolchain and Cargo.lock. The workspace's own
      # crates are still compiled on every run.
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --no-fail-fast
      - name: Set up Secret Service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y gnome-keyring libsecret-tools dbus-x11
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo "test-password" | gnome-keyring-daemon --unlock --components=secrets
      - name: System keyring round trip
        run: cargo test --locked --workspace --lib -- --ignored system_keyring_round_trip
      # Releases generate these notices; this catches a crate without a
      # license file before release time.
      - name: Generate third-party license notices
        if: runner.os == 'Linux'
        run: cargo xtask licenses --output "$RUNNER_TEMP/THIRD_PARTY_LICENSES.md"

  # The flake builds with the rustc from the nixpkgs pinned in flake.lock, not
  # rust-toolchain.toml. If this fails on a too-old compiler, run
  # `nix flake update`.
  nix:
    name: nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - name: Build the flake
        run: nix build .#linear -L
      - name: Run the built binary
        run: ./result/bin/linear --version
