name: Rust native reader fakes

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  reader-fakes:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: rust
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v3
      - name: Install pinned Rust
        run: rustup toolchain install 1.93.0 --profile minimal --component clippy --component rustfmt
      - name: Check native cfg and test compilation
        run: cargo +1.93.0 check --locked --workspace --all-targets
      - name: Deny warnings
        run: cargo +1.93.0 clippy --locked -p linear-cli --all-targets -- -D warnings
      - name: Check Rust formatting
        run: cargo +1.93.0 fmt --all -- --check
      - name: Pure process argv and Windows blob/layout contracts
        run: |
          cargo +1.93.0 test --locked -p linear-cli --test auth native_reader_spec
          cargo +1.93.0 test --locked -p linear-cli --test auth windows
      - name: Dummy metadata startup and ordinary reads
        run: cargo +1.93.0 test --locked -p linear-cli --test commands native_reader_startup
      - name: Unix private process readers, including Mac flavor
        if: runner.os != 'Windows'
        run: cargo +1.93.0 test --locked -p linear-cli --test auth keyring

  full-suite:
    name: Full Rust suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            optional: false
          - os: macos-latest
            optional: false
          - os: windows-latest
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    defaults:
      run:
        shell: bash
        working-directory: rust
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v3
      - name: Install pinned Rust
        run: rustup toolchain install 1.93.0 --profile minimal --component clippy --component rustfmt
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.7.9"
      - name: Cache parity driver dependencies
        working-directory: .
        run: deno cache --frozen --config rust/parity/deno.json rust/parity/runner/serve-case.ts
      - name: Install fish and bubblewrap
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y fish bubblewrap
          else
            brew install fish
          fi
      - name: Run full Rust suite
        run: cargo +1.93.0 test --locked --no-fail-fast
