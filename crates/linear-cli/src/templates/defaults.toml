guide_graphql = '''
{% block content -%}
## GraphQL fallback

Check the schema for the types and fields you need:

```bash
linear schema -o "${TMPDIR:-/tmp}/linear-schema.graphql"
```

```bash no-check
grep -i "cycle" "${TMPDIR:-/tmp}/linear-schema.graphql"
grep -A 30 "^type Issue " "${TMPDIR:-/tmp}/linear-schema.graphql"
```

Put a leading `query` or `mutation` keyword inside the quoted document: write
`linear api 'query { ... }'`, never `linear api query '...'`. A document that
contains a non-null marker (`String!`) goes on stdin through a heredoc, which
avoids shell escaping.

```bash
linear api '{ viewer { id name email } }'

linear api --variable teamId=abc123 <<'GRAPHQL'
query($teamId: String!) { team(id: $teamId) { name } }
GRAPHQL

linear api --variable first=5 <<'GRAPHQL'
query($first: Int!) { issues(first: $first) { nodes { title } } }
GRAPHQL

linear api --variables-json '{"filter": {"state": {"name": {"eq": "In Progress"}}}}' <<'GRAPHQL'
query($filter: IssueFilter!) { issues(filter: $filter) { nodes { title } } }
GRAPHQL

linear api '{ issues(first: 5) { nodes { identifier title } } }' | jq '.data.issues.nodes[].title'
```

For full control over the HTTP request, `linear auth token` prints the token:

```bash no-check
curl -s -X POST https://api.linear.app/graphql \
  -H "Content-Type: application/json" \
  -H "Authorization: $(linear auth token)" \
  -d '{"query": "{ viewer { id } }"}'
```
{% endblock %}'''

commit_description = '''{% block content %}{{ issue.identifier }} {{ issue.title }}

Linear-issue: {{ linkage }} {{ issue.identifier }}
Linear-issue-url: {{ issue.url }}
{% endblock %}'''
pr_title = '''{% block content %}{% if issues | length == 1 %}{{ issues[0].identifier }} {{ issues[0].title }}{% else %}{{ fail("Pass --title for a pull request covering several issues, or configure templates.pr_title.") }}{% endif %}{% endblock %}'''
pr_body = '''{% block content %}{% if description %}{{ description }}

{% endif %}{% include "pr_issue_links" %}{% endblock %}'''
pr_issue_links = '''{% block content %}{{ issue_clause }}

{% for issue in issues %}{{ issue.url }}{% if not loop.last %}
{% endif %}{% endfor %}{% endblock %}'''

