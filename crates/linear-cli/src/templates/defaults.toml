# Shipped guide prose, message templates and display templates.
# Shipped names are registered as immutable builtin/<name> aliases by Rust.
# Facts: version, markdown_rules, exit_status, commands, command_guidance, command_help.
# Rust assembles command_guidance by discovering all effective command hooks.
# Markdown rules and exit status remain canonical Rust-generated facts.

[templates]
format_issue_id = '''{% block content %}{% if issue.url %}{{ hyperlink(issue.url, issue.identifier) }}{% else %}{{ issue.identifier }}{% endif %}{% endblock %}'''

guide = '''
{% block content -%}
{% include "guide_intro" -%}
{% include "guide_how_to_work" -%}
{% include "guide_common_tasks" -%}
{{ command_guidance -}}
{% include "guide_markdown_rules" -%}
{% include "guide_exit_status" -%}
{% include "guide_help_notes" -%}
{% include "guide_commands" -%}
{% endblock %}'''

guide_targeted = '''
